name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run tests
        run: cargo test
      - name: Build
        run: cargo build --release

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: cargo build --locked
      - run: python -m pip install -r tools/requirements-render-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Install PDF test inspector
        run: sudo apt-get install --yes poppler-utils
      - name: Fetch pinned Korean test font
        run: |
          curl --fail --location --output "$RUNNER_TEMP/NotoSansKR.ttf" 'https://raw.githubusercontent.com/google/fonts/b38c5c93af322c45f633e17ac440ec1e6c94d489/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf'
          echo "194018e6b2b293a7964f037b25c0249ce1418bc9ab3c971060a03aa57861e252  $RUNNER_TEMP/NotoSansKR.ttf" | sha256sum --check
      - name: Synthetic Korean render and failure checks
        env:
          WB_RENDER_FONT: ${{ runner.temp }}/NotoSansKR.ttf
          WB_RENDER_ARTIFACTS: render-smoke
        run: python -m unittest discover -s tools -p test_render.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-render
          path: render-smoke/
